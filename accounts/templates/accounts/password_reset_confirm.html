{% extends "base.html" %}
{% block title %}Set New Password — CollegeMS{% endblock %}
{% block content %}
  <div class="form-card">
    <h1>Set a new password</h1>
    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Change password</button>
      </form>
    {% else %}
      <p>This password reset link is invalid or has expired.</p>
    {% endif %}
  </div>
{% endblock %}
