{% extends "base.html" %}
{% block title %}Login — CollegeMS{% endblock %}
{% block content %}
  <div class="form-card">
    <h1>Login</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="button">Log in</button>
    </form>
    <p><a href="{% url 'accounts:password_reset' %}">Forgot password?</a></p>
  </div>
{% endblock %}
